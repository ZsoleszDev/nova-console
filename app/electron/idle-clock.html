<!doctype html><html lang="hu"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><title>NOVA óra</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b;color:#848484;font-family:'Segoe UI',sans-serif;cursor:none}body{display:grid;place-items:center}time{font-size:clamp(60px,10vw,170px);font-weight:200;letter-spacing:.06em;font-variant-numeric:tabular-nums}</style><time></time><script>const clock=document.querySelector('time');function tick(){const d=new Date();clock.textContent=d.toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'});const n=d.getMinutes();clock.style.transform=`translate(${(n%7-3)*9}px,${(n%5-2)*8}px)`;}tick();setInterval(tick,1000);</script></html>
